name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version d'Xcode
        run: xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature, SideStore signera sur l'iPhone)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project SelfBuild.xcodeproj \
            -scheme SelfBuild \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Résumé des erreurs (si échec)
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -n 40 || true

      - name: Envoyer le journal de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Fabriquer le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SelfBuild.app Payload/
          zip -qry SelfBuild.ipa Payload
          ls -lh SelfBuild.ipa

      - name: Publier l'IPA dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" SelfBuild.ipa \
            --title "Build ${{ github.run_number }}" \
            --notes "IPA non signé : à installer avec SideStore."
