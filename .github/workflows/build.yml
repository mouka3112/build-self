name: Build IPA

on:
  push:
    branches: [main, v3]
  workflow_dispatch:

permissions:
  contents: write

# Un seul build à la fois par branche : un nouveau push annule le build en cours.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version d'Xcode
        run: xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature, SideStore signera sur l'iPhone)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project SelfBuild.xcodeproj \
            -scheme SelfBuild \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Résumé des erreurs (si échec)
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -n 40 || true

      - name: Envoyer le journal de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Vérifier que l'extension Dynamic Island est dans l'app
        shell: bash
        run: |
          APPEX="build/Build/Products/Release-iphoneos/SelfBuild.app/PlugIns/SelfBuildWidget.appex"
          if [ ! -d "$APPEX" ]; then
            echo "::error::EXTENSION ABSENTE : $APPEX introuvable (la Live Activity ne marcherait pas)"
            ls -R build/Build/Products/Release-iphoneos/SelfBuild.app/PlugIns || true
            exit 1
          fi
          echo "Extension présente : $APPEX"

      - name: Fabriquer le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SelfBuild.app Payload/
          zip -qry SelfBuild.ipa Payload
          ls -lh SelfBuild.ipa

      - name: Publier l'IPA dans les Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHORT="${GITHUB_SHA::7}"
          MSG="$(git log -1 --pretty=%s)"
          EXTRA=""
          if [ "$BRANCH" != "main" ]; then EXTRA="--prerelease"; fi
          # --target : le tag pointe sur le commit réellement compilé (et pas sur main par défaut).
          gh release create "build-${{ github.run_number }}" SelfBuild.ipa \
            --target "$GITHUB_SHA" $EXTRA \
            --title "Build ${{ github.run_number }} · $BRANCH · $SHORT" \
            --notes "IPA non signé (branche $BRANCH, commit $SHORT) : $MSG. À installer avec SideStore (voir GUIDE_SANS_MAC.md)."
