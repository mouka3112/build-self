name: SelfBuild
options:
  bundleIdPrefix: com.melik
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Réglages de compilation obligatoires (voir docs/V3_ARCHITECTURE.md)
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  SelfBuild:
    type: application
    platform: iOS
    sources:
      - path: SelfBuild
    dependencies:
      - target: SelfBuildWidget
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: SELF BUILD
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
          - location
        NSLocationWhenInUseUsageDescription: Suivre ta course (distance, allure et tracé sur la carte)
        NSFaceIDUsageDescription: Verrouiller ton Safe Space et tes photos de progression
        NSCameraUsageDescription: Photographier tes devoirs, tes cours, tes repas, tes habits et tes tickets de caisse
        NSPhotoLibraryUsageDescription: Choisir une photo de devoirs, de cours, de repas ou de ticket
        NSMicrophoneUsageDescription: Dictée vocale pour parler à Nexus et écrire tes notes
        NSSpeechRecognitionUsageDescription: Transcrire ta voix en texte (français)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melik.selfbuild
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SelfBuildWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SelfBuildWidget
      - path: SelfBuild/SelfBuildAttributes.swift   # partagé entre l'app et l'extension
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: SELF BUILD Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melik.selfbuild.widget
        TARGETED_DEVICE_FAMILY: "1"
