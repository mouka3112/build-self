name: SelfBuild
options:
  bundleIdPrefix: com.melik
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SelfBuild:
    type: application
    platform: iOS
    sources:
      - path: SelfBuild
    dependencies:
      - target: SelfBuildWidget
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: SELF BUILD
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
          - location
        NSLocationWhenInUseUsageDescription: Suivre ta course (distance et tracé)
        NSFaceIDUsageDescription: Verrouiller ton Safe Space et tes photos de progression
        NSCameraUsageDescription: Prendre en photo tes devoirs et tes tickets de caisse
        NSPhotoLibraryUsageDescription: Choisir une photo de devoirs ou de ticket
        NSMicrophoneUsageDescription: Dictée vocale
        NSSpeechRecognitionUsageDescription: Transcrire ta voix en texte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melik.selfbuild
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SelfBuildWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SelfBuildWidget
      - path: SelfBuild/SelfBuildAttributes.swift
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: SELF BUILD Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melik.selfbuild.widget
        TARGETED_DEVICE_FAMILY: "1"
